<!DOCTYPE html>
<html lang="en" class="dark">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="csrf-token" content="">

        <title>Laravel</title>

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.bunny.net">
        <link href="https://fonts.bunny.net/css?family=figtree:400,500,600&display=swap" rel="stylesheet" />

        <!-- Scripts -->
        <link rel="preload" as="style" href="assets/app-5GQ4Cenj.css" /><link rel="modulepreload" as="script" href="assets/app-DO2nEFzp.js" /><link rel="stylesheet" href="assets/app-5GQ4Cenj.css" /><script type="module" src="assets/app-DO2nEFzp.js"></script>        <style>
            body { background-color: #0D0D12; }
        </style>
    </head>
    <body class="font-sans text-gray-200 antialiased bg-[#0D0D12]">
        <div class="min-h-screen flex flex-col sm:justify-center items-center pt-6 sm:pt-0 relative overflow-hidden">
            <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10"></div>
            
            <div class="relative z-10">
                <a href="/" class="text-4xl font-extrabold text-[#00FF66] tracking-wider drop-shadow-[0_0_8px_rgba(0,255,102,0.5)]">
                    RENTAL<span class="text-[#6600FF]">APP</span>
                </a>
            </div>

            <div class="w-full sm:max-w-md mt-8 px-8 py-10 bg-[#1A1B26] border border-[#2A2B3D] shadow-[0_0_30px_rgba(102,0,255,0.15)] overflow-hidden sm:rounded-2xl relative z-10">
                <h2 class="text-2xl font-bold text-white mb-6 text-center">Create an account</h2>
    
    <form method="POST" action="register.html" class="space-y-6">
        <input type="hidden" name="_token" value="" autocomplete="off">
        <!-- Name -->
        <div>
            <label for="name" class="block font-medium text-sm text-gray-300">Name</label>
            <input id="name" class="block mt-1 w-full bg-[#0B0F19] border border-[#2A2B3D] text-white focus:border-[#6600FF] focus:ring-[#6600FF] rounded-md shadow-sm" type="text" name="name" value="" required autofocus autocomplete="name" />
                    </div>

        <!-- Email Address -->
        <div>
            <label for="email" class="block font-medium text-sm text-gray-300">Email</label>
            <input id="email" class="block mt-1 w-full bg-[#0B0F19] border border-[#2A2B3D] text-white focus:border-[#6600FF] focus:ring-[#6600FF] rounded-md shadow-sm" type="email" name="email" value="" required autocomplete="username" />
                    </div>

        <!-- Password -->
        <div>
            <label for="password" class="block font-medium text-sm text-gray-300">Password</label>
            <input id="password" class="block mt-1 w-full bg-[#0B0F19] border border-[#2A2B3D] text-white focus:border-[#6600FF] focus:ring-[#6600FF] rounded-md shadow-sm" type="password" name="password" required autocomplete="new-password" />
                    </div>

        <!-- Confirm Password -->
        <div>
            <label for="password_confirmation" class="block font-medium text-sm text-gray-300">Confirm Password</label>
            <input id="password_confirmation" class="block mt-1 w-full bg-[#0B0F19] border border-[#2A2B3D] text-white focus:border-[#6600FF] focus:ring-[#6600FF] rounded-md shadow-sm" type="password" name="password_confirmation" required autocomplete="new-password" />
                    </div>

        <div class="flex items-center justify-between mt-4 border-t border-[#2A2B3D] pt-6">
            <a class="underline text-sm text-gray-400 hover:text-white rounded-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#6600FF]" href="login.html">
                Already registered?
            </a>

            <button type="submit" class="bg-[#6600FF] text-white font-bold py-2 px-6 rounded-md hover:bg-[#5500DD] transition shadow-[0_0_15px_rgba(102,0,255,0.4)]">
                Register
            </button>
        </div>
    </form>
            </div>
        </div>
    
<script>
document.addEventListener('DOMContentLoaded', function() {
    const role = localStorage.getItem('role');
    const navLinksContainer = document.querySelector('.hidden.sm\\:-my-px.sm\\:ms-10.sm\\:flex');
    const settingsDropdown = document.querySelector('.hidden.sm\\:flex.sm\\:items-center.sm\\:ms-6');
    const isLoginOrRegister = window.location.pathname.includes('login.html') || window.location.pathname.includes('register.html');

    if (!isLoginOrRegister && role && settingsDropdown) {
        if (role === 'admin') {
            if(navLinksContainer) {
                navLinksContainer.innerHTML = '<a class="inline-flex items-center px-1 pt-1 border-b-2 border-transparent text-sm font-medium leading-5 text-gray-500 hover:text-white transition duration-150 ease-in-out" href="admin-dashboard.html">Admin Dashboard</a>';
            }
            settingsDropdown.innerHTML = '<span class="text-sm text-[#00FF66] mr-4 font-bold">Admin (Demo)</span><a href="index.html" onclick="localStorage.removeItem(\'role\')" class="text-sm bg-red-600 text-white px-4 py-2 rounded font-bold hover:bg-red-500 transition">Logout</a>';
        } else if (role === 'user') {
            if(navLinksContainer) {
                navLinksContainer.innerHTML = '<a class="inline-flex items-center px-1 pt-1 border-b-2 border-transparent text-sm font-medium leading-5 text-gray-500 hover:text-white transition duration-150 ease-in-out mr-4" href="index.html">Katalog</a><a class="inline-flex items-center px-1 pt-1 border-b-2 border-transparent text-sm font-medium leading-5 text-gray-500 hover:text-white transition duration-150 ease-in-out mr-4" href="cart.html">Keranjang</a><a class="inline-flex items-center px-1 pt-1 border-b-2 border-transparent text-sm font-medium leading-5 text-gray-500 hover:text-white transition duration-150 ease-in-out" href="rentals.html">Sewa Saya</a>';
            }
            settingsDropdown.innerHTML = '<span class="text-sm text-gray-300 mr-4 font-semibold">User (Demo)</span><a href="index.html" onclick="localStorage.removeItem(\'role\')" class="text-sm bg-red-600 text-white px-4 py-2 rounded font-bold hover:bg-red-500 transition">Logout</a>';
        }
    } else if (!isLoginOrRegister && !role && settingsDropdown) {
        if(navLinksContainer) {
            navLinksContainer.innerHTML = '<a class="inline-flex items-center px-1 pt-1 border-b-2 border-transparent text-sm font-medium leading-5 text-gray-500 hover:text-white transition duration-150 ease-in-out" href="index.html">Katalog</a>';
        }
        settingsDropdown.innerHTML = '<a href="login.html" class="text-sm text-gray-300 hover:text-white font-bold mr-4">Log in</a><a href="register.html" class="text-sm bg-[#6600FF] text-white px-4 py-2 rounded font-bold hover:bg-[#5500DD]">Register</a>';
    }
});
</script>
</body>

</html>
